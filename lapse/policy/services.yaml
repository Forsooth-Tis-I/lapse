# Reviewed 2026-10-17. See docs/policy-notes.md for scope and unresolved requirements.
# Methods are AND within needs_roles, OR across methods. An identifier is not inbox possession.
# modelled:false is unknown, not safe; retained methods are only documented subsets.
# Tier 3 requires lists can be incomplete. Empty does not establish proof-free changes.
# Notification patterns are best-effort completion candidates, not captured email fixtures.
services:
  # Recovery is risk-adaptive: phone/email OTP alone is not guaranteed to reset Google.
  # Password-only/passkey profiles cannot be selected by this schema. Email change here is recovery email.
  - service: {id: google, name: Google, domains: [google.com, accounts.google.com, notifications.google.com], category: identity, modelled: false, doc_url: 'https://support.google.com/accounts/answer/183723'}
    verified_at: 2026-10-17
    methods:
      - {id: login_password_sms, kind: login, label: 'Password and configured SMS second factor', needs_roles: [sms_2fa], needs_password: true, doc_url: 'https://support.google.com/accounts/answer/185839'}
      - {id: login_password_totp, kind: login, label: 'Password and configured authenticator code', needs_roles: [totp_device], needs_password: true, doc_url: 'https://support.google.com/accounts/answer/185839'}
    change:
      # Assisted preparation hints; Google can request more proof or defer sensitive changes.
      - {root_kind: phone, tier: 3, requires: [password, new_otp], settings_url: 'https://myaccount.google.com/signinoptions/rescuephone', recipe: null, confirmation_patterns: ['(?i)recovery phone.{0,60}(?:was|has been) (?:changed|updated)'], doc_url: 'https://support.google.com/accounts/answer/183723'}
      - {root_kind: email, tier: 3, requires: [password], settings_url: 'https://myaccount.google.com/recovery/email', recipe: null, confirmation_patterns: ['(?i)recovery email.{0,60}(?:was|has been) (?:changed|updated)'], doc_url: 'https://support.google.com/accounts/answer/183723'}
