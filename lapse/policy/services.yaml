      - {id: reset_recovery_email, kind: reset, label: Reset password through recovery email, needs_roles: [recovery_email], needs_password: false, requires_absent_roles: [sms_2fa, totp_device], doc_url: 'https://support.google.com/accounts/answer/7682439'}
      - {id: reset_recovery_email_then_sms, kind: reset, label: Reset through recovery email then SMS, needs_roles: [recovery_email, sms_2fa], needs_password: false, doc_url: 'https://support.google.com/accounts/answer/7682439'}
