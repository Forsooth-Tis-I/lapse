[project]
name = "lapse"
version = "0.1.0"
description = "Finds every account still tied to a phone number, email, or domain you no longer control, and fixes it with your approval. FalkorDB is the core."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "falkordb>=1.8.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "redis>=5.0",
  "openai>=1.50",
  "mcp>=1.2",
  "python-telegram-bot>=21.6",
  "imapclient>=3.0",
  "apscheduler>=3.10,<4",
  "cryptography>=43",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
lapse-api = "lapse.api.main:run"
lapse-worker = "lapse.worker:run"
lapse-bot = "lapse.bot.main:run"
lapse-mcp = "lapse.agent.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: needs a running FalkorDB (make up)"]

[tool.ruff]
line-length = 110
target-version = "py312"
